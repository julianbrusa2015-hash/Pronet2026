[build]
  command = "npm install --include=dev && npm run build"
  publish = "."

[build.environment]
  NODE_ENV = "production"

# Comprimir imágenes automáticamente (el CSS ya lo minificamos nosotros)
[build.processing.images]
  compress = true

# Service worker: nunca cachear para que las actualizaciones lleguen inmediatamente
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# JS y CSS: 1 hora — balance entre velocidad y actualizaciones frecuentes
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Íconos e imágenes: 1 semana (cambian poco)
[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# HTML principal: siempre revalidar
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    # Evita que la app se embeba en iframes de otros sitios (clickjacking)
    X-Frame-Options = "DENY"

    # Evita que el browser intente adivinar el tipo de archivo
    X-Content-Type-Options = "nosniff"

    # Controla qué información se envía al navegar a otros sitios
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Restringe acceso a features del browser
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

    # Content Security Policy — controla de dónde se cargan recursos
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.supabase.co https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in https://maps.googleapis.com https://maps.gstatic.com https://*.ggpht.com; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://maps.googleapis.com; worker-src 'self' blob:; manifest-src 'self';"
