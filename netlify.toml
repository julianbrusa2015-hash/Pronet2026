# Optimización automática de assets en el CDN de Netlify
# Minifica CSS (ahorra ~4 KB), comprime imágenes. JS no se toca para no romper el sourcemap.
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = true
[build.processing.js]
  bundle = false
  minify = false
[build.processing.html]
  pretty_urls = false
[build.processing.images]
  compress = true

# Service worker: nunca cachear para que las actualizaciones lleguen inmediatamente
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# JS y CSS: siempre revalidar contra el origen (ETag/304, casi tan rápido
# como cachear, pero garantiza que cada deploy llegue de inmediato). El
# max-age=3600 anterior dejaba a la CDN sirviendo versiones viejas hasta
# una hora después de cada push, independiente del Service Worker.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

# Íconos e imágenes: 1 semana (cambian poco)
[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# HTML principal: siempre revalidar
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    # Evita que la app se embeba en iframes de otros sitios (clickjacking)
    X-Frame-Options = "DENY"

    # Evita que el browser intente adivinar el tipo de archivo
    X-Content-Type-Options = "nosniff"

    # Controla qué información se envía al navegar a otros sitios
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Restringe acceso a features del browser
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

    # Content Security Policy — controla de dónde se cargan recursos
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.supabase.co https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in https://maps.googleapis.com https://maps.gstatic.com https://*.ggpht.com; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://maps.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; frame-src https://www.openstreetmap.org;"

# ── Qué NO se publica ────────────────────────────────────────────────────────
#
# No hay `publish` configurado, así que Netlify sirve la RAÍZ DEL REPO: los 183
# .sql con el esquema y las policies de RLS, el código de las Edge Functions
# que cobran, los tests, los scripts y las notas del proyecto quedaban
# descargables por cualquiera. Nada de eso lo necesita la app en el browser.
#
# No hay secretos ahí (.env, config-secrets.js y el keystore están en
# .gitignore, así que nunca se deployean), pero publicar el esquema completo y
# las policies le ahorra la mitad del trabajo a cualquiera que quiera atacar la
# base. Y el día que alguien agregue un archivo sensible sin pensarlo, ya está
# publicado.
#
# `force = true` es imprescindible: sin eso Netlify sirve el archivo estático y
# la regla nunca llega a evaluarse.
[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/android/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/capacitor.config.json"
  to = "/index.html"
  status = 404
  force = true
