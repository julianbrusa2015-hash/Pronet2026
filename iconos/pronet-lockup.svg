<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 324" width="560" height="324" role="img" aria-label="PRONET — Servicios de confianza en tu zona">
  <title>PRONET — bloque vertical</title>
  <!-- Bloque completo para la portada de la app: red + logotipo + bajada.
       Reemplaza el emoji 🔧 del login-hero (index.html:2827).
       Va sobre el degradado de marca
       linear-gradient(160deg,#0D0F1A,#1A3ACC 60%,#2B5BFF).
       La N va VERDE: el azul de marca #2B5BFF es el final del propio
       degradado, así que una N azul se borraría sobre su fondo.

       Centrados calculados sobre el bbox REAL, no sobre el ancho nominal:
       la oblicua corre la base de las letras 21 unidades a la izquierda,
       así que centrar por el ancho del dibujo dejaba el logotipo 20 px
       descolgado del eje. -->

  <!-- Red · contenido x 8..112, centro 60 → 220+60 = 280 = eje del lienzo -->
  <g transform="translate(220,16)" color="#10B981">
    <g stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".6" fill="none">
      <path d="M58,54 L16,34"/><path d="M58,54 L52,12"/><path d="M58,54 L100,30"/>
      <path d="M58,54 L104,78"/><path d="M58,54 L30,88"/>
      <path d="M16,34 L52,12"/><path d="M100,30 L104,78"/>
    </g>
    <g fill="currentColor">
      <circle cx="58" cy="54" r="11"/><circle cx="16" cy="34" r="8"/>
      <circle cx="52" cy="12" r="9"/><circle cx="100" cy="30" r="7.5"/>
      <circle cx="104" cy="78" r="8"/><circle cx="30" cy="88" r="7"/>
    </g>
  </g>

  <!-- Logotipo · bbox inclinado -21.26..518, centro 248.4 ×0.86 = 213.6
       → 66.4+213.6 = 280 = eje del lienzo -->
  <g transform="translate(66.4,184) scale(0.86)">
    <g transform="skewX(-12)">
      <g fill="#FFFFFF">
        <path fill-rule="evenodd" d="M0,0 H33 A29,29 0 0 1 33,58 H23 V100 H0 Z M23,23 H33 A6,6 0 0 1 33,35 H23 Z"/>
        <g transform="translate(74,0)">
          <path fill-rule="evenodd" d="M0,0 H33 A29,29 0 0 1 33,58 H23 V100 H0 Z M23,23 H33 A6,6 0 0 1 33,35 H23 Z"/>
          <path d="M30,52 H52 L74,100 H52 Z"/>
        </g>
        <path fill-rule="evenodd" transform="translate(160,0)" d="M0,50 A47,50 0 1 1 94,50 A47,50 0 1 1 0,50 Z M23,50 A24,27 0 1 1 71,50 A24,27 0 1 1 23,50 Z"/>
        <path transform="translate(358,0)" d="M0,0 H68 V23 H23 V38.5 H61 V61.5 H23 V77 H68 V100 H0 Z"/>
        <path transform="translate(438,0)" d="M0,0 H80 V23 H51.5 V100 H28.5 V23 H0 Z"/>
      </g>
      <path fill="#10B981" transform="translate(266,0)"
            d="M0,0 H23 V100 H0 Z M23,0 H48 L80,100 H55 Z M57,-12 H80 V100 H57 Z M68.5,-50 L96,-12 H41 Z"/>
    </g>
  </g>

  <!-- Bajada · texto vivo a propósito: se edita sin abrir un editor
       vectorial y no forma parte de la marca registrable. -->
  <text x="280" y="304" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="21" font-weight="500" letter-spacing="0.3"
        fill="#FFFFFF" fill-opacity=".72">Servicios de confianza en tu zona</text>
</svg>
