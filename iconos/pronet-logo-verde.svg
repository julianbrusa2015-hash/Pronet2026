<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -58 556 166" width="556" height="166" role="img" aria-label="PRONET">
  <title>PRONET — sobre fondo de marca</title>
  <!-- Variante para el degradado azul de la app
       (linear-gradient(160deg,#0D0F1A,#1A3ACC 60%,#2B5BFF)).
       La N va VERDE porque el azul de marca #2B5BFF es exactamente el
       final del degradado: una N azul se borra sobre su propio fondo. -->
  <g transform="skewX(-12)">
    <g fill="#FFFFFF">
      <path fill-rule="evenodd" d="M0,0 H33 A29,29 0 0 1 33,58 H23 V100 H0 Z M23,23 H33 A6,6 0 0 1 33,35 H23 Z"/>
      <g transform="translate(74,0)">
        <path fill-rule="evenodd" d="M0,0 H33 A29,29 0 0 1 33,58 H23 V100 H0 Z M23,23 H33 A6,6 0 0 1 33,35 H23 Z"/>
        <path d="M30,52 H52 L74,100 H52 Z"/>
      </g>
      <path fill-rule="evenodd" transform="translate(160,0)" d="M0,50 A47,50 0 1 1 94,50 A47,50 0 1 1 0,50 Z M23,50 A24,27 0 1 1 71,50 A24,27 0 1 1 23,50 Z"/>
      <path transform="translate(358,0)" d="M0,0 H68 V23 H23 V38.5 H61 V61.5 H23 V77 H68 V100 H0 Z"/>
      <path transform="translate(438,0)" d="M0,0 H80 V23 H51.5 V100 H28.5 V23 H0 Z"/>
    </g>
    <path fill="#10B981" transform="translate(266,0)"
          d="M0,0 H23 V100 H0 Z
             M23,0 H48 L80,100 H55 Z
             M57,-12 H80 V100 H57 Z
             M68.5,-50 L96,-12 H41 Z"/>
  </g>
</svg>
